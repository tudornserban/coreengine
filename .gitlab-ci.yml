stages: [build]

variables:
  DEBIAN_FRONTEND: noninteractive

agentic-module-manifests:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends python3
  script:
    - chmod +x scripts/check-module-deps.sh
    - ./scripts/check-module-deps.sh
    - python3 scripts/test_check_module_deps.py

math-module-pilot:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends
        cmake ninja-build build-essential libgtest-dev python3
  script:
    - chmod +x scripts/run-math-module-tests.sh scripts/check-module-deps.sh
    - ./scripts/check-module-deps.sh
    - ./scripts/run-math-module-tests.sh

influence-module-pilot:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends
        cmake ninja-build build-essential libgtest-dev python3
  script:
    - chmod +x scripts/run-influence-module-tests.sh scripts/check-module-deps.sh
    - ./scripts/check-module-deps.sh
    - ./scripts/run-influence-module-tests.sh

logging-module-pilot:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends
        cmake ninja-build build-essential libgtest-dev python3
  script:
    - chmod +x scripts/run-logging-module-tests.sh scripts/check-module-deps.sh
    - ./scripts/check-module-deps.sh
    - ./scripts/run-logging-module-tests.sh

build-and-test:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends
        cmake ninja-build build-essential libgtest-dev
  script:
    - ./scripts/check-module-deps.sh
    - cmake -S . -B build -G Ninja -DBUILD_TESTS=ON
    - cmake --build build --parallel 4
    - cd build && ctest --output-on-failure